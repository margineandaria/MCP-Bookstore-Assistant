<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Librării Cărturești - Asistent</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 30px;
            background-color: #fafafa;
        }
        h2 { color: #4a3b2a; }
        h4 { color: #6b5b4a; margin-top: 5px; margin-bottom: 20px; }
        
        /* Am adăugat un container mic pentru a distanța bara de search de caseta de chat */
        #zonaCautare {
            margin-bottom: 15px; 
        }
        
        #zonaConversatie {
            width: 100%;
            height: 480px;
            border: 1px solid #c9bfb0;
            border-radius: 6px;
            padding: 12px;
            overflow-y: auto;
            background-color: #ffffff;
        }
        input[type="text"] {
            width: 78%;
            padding: 10px;
            border: 1px solid #c9bfb0;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px 22px;
            cursor: pointer;
            background-color: #6b5b4a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover { background-color: #4a3b2a; }
        .replicaUtilizator {
            color: #1f4e79;
            margin-bottom: 10px;
            padding: 6px 10px;
            background-color: #eef5fb;
            border-radius: 4px;
        }
        .replicaSistem {
            color: #2d5a2d;
            margin-bottom: 10px;
            padding: 6px 10px;
            background-color: #eef7ee;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .replicaEroare {
            color: #a02020;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h2>Librării Cărturești - Asistent inteligent</h2>

    <div id="zonaCautare">
        <input
            type="text"
            id="campIntrebare"
            placeholder="Ex: Ce carti a scris Colleen Hoover?"
            onkeydown="if (event.key === 'Enter') trimiteIntrebare()">
        <button onclick="trimiteIntrebare()">Trimite</button>
    </div>
    <div id="zonaConversatie"></div>

    <script>
        async function trimiteIntrebare() {
            const camp = document.getElementById('campIntrebare');
            const zona = document.getElementById('zonaConversatie');
            const intrebare = camp.value.trim();
            if (!intrebare) return;

            zona.innerHTML += `<div class="replicaUtilizator"><b>Tu:</b> ${intrebare}</div>`;
            camp.value = '';
            zona.scrollTop = zona.scrollHeight;

            try {
                const cerere = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: intrebare })
                });

                const date = await cerere.json();
                console.log("Raspuns server:", date);

                const text = date.reply || "Serverul a intors un raspuns gol.";
                zona.innerHTML += `<div class="replicaSistem"><b>Asistent:</b> ${text}</div>`;
                zona.scrollTop = zona.scrollHeight;

            } catch (e) {
                zona.innerHTML += `<div class="replicaEroare"><b>Eroare:</b> nu m-am putut conecta la server.</div>`;
                console.log(e);
            }
        }
    </script>
</body>
</html>
